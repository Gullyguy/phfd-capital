steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/phfd-capital/app:$COMMIT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/phfd-capital/app:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - phfd-capital
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/phfd-capital/app:$COMMIT_SHA
      - --region=us-central1
      - --allow-unauthenticated
      - --set-env-vars=PHFD_USE_FIRESTORE=true,LIVE_PROVIDER_MODE=false,PHFD_ADMIN_USER=admin
      - --set-secrets=PHFD_ADMIN_PASSWORD=PHFD_ADMIN_PASSWORD:latest
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/phfd-capital/app:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
